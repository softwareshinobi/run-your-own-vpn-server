services:

##########################################
##
## public / network infrastructure
##
##########################################

    public-openvpn-server:

        container_name: public-openvpn-server
        
        image: kylemanna/openvpn

        restart: unless-stopped
                
        cap_add:

            - NET_ADMIN       

        volumes:

            - /volumes/intranet/openvpn:/etc/openvpn

        ports:

            - "1194:1194/udp"

##########################################
##
## private / identity & access managment
##
##########################################

    public-openvpn-proxy:

        container_name: public-openvpn-proxy

        image: softwareshinobi/basic-container-auth-proxy

        restart: unless-stopped

        ports:

            - 1194:80

        environment:
            
##            BASIC_AUTH_USERNAME: shinobi
##
##            BASIC_AUTH_PASSWORD: password

            PROXY_PASS: http://private-openvpn-keys/

    private-openvpn-keys:

        container_name: private-openvpn-keys
        
        image: softwareshinobi/embanet-intranet-keys

        restart: unless-stopped

        build: 

            context: publisher

            dockerfile: Dockerfile
      
        volumes:

            - /volumes/intranet/openvpn/:/usr/share/nginx/html/keys/

        ports:

            - "127.0.0.1:1188:80"
            
            - "10.28.1.1:1188:80"

##########################################
##
## public / vpn server documentation
##
##########################################

    private-openvpn-docs:

        container_name: private-openvpn-docs

        image: softwareshinobi/embanet-intranet-docs

        build: 

            context: docs

            dockerfile: Dockerfile
      
        restart: unless-stopped
  
        ports:

            - "1180:80"

##########################################
##
## vpn traffic / accessible on VPS only
##
##########################################

    private-network-landing:

        container_name: private-network-landing

        image: softwareshinobi/embanet-intranet-landing

        build: 

            context: landing

            dockerfile: Dockerfile
 
        restart: unless-stopped
  
        ports:

            - "127.0.0.1:5555:80"
            
            - "10.28.1.1:5555:80"        
